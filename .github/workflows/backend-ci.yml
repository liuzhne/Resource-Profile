name: backend-ci

# T15/A8：测试门禁。PR 触及后端/Python 即跑全量单测，必须全绿才可合并。
# 安全关键单测（网关鉴权 JwtAuthGlobalFilter、越权 AccessGuard + 各 controller、字段权限
# FieldPermissionAdvice）在此回归。
# 注：采用「测试全绿」门而非覆盖率百分比门——历史业务模块覆盖稀疏，硬覆盖率阈值会误红；
# 覆盖率门待补齐核心模块单测后再引入（见 PROJECT_REVIEW §5.3 T15）。

on:
  pull_request:
    paths:
      - "backend/**"
      - "ai-inference-service/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn clean test (all modules)
        working-directory: backend
        # Spring AI 1.1.6 GA 在 Maven Central，无需 milestone repo
        run: mvn -B -ntp clean test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: unittest (pure-logic, 无外部依赖)
        working-directory: ai-inference-service
        # 纯函数单测走延迟 import + 降级，无需 redis/milvus/llm 也能跑
        run: python -m unittest discover -s tests -p "test_*.py" -v
