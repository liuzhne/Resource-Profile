version: '3.8'

services:
  ai-inference-service:
    container_name: ai-inference-service
    build:
      context: ../ai-inference-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      # 三个模型均运行在宿主机 llama.cpp（Metal GPU 加速），通过 host.docker.internal 访问：
      #   8091 = Qwen2.5 生成 LLM    （~/edu-ai/start-llm-server.sh）
      #   8092 = BGE-large-zh embedding（scripts/start-embedding-server.sh）
      #   8093 = BGE-reranker rerank   （scripts/start-reranker-server.sh）
      - LLM_BASE_URL=http://host.docker.internal:8091/v1
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=2048
      - EMBEDDING_BASE_URL=http://host.docker.internal:8092/v1
      - EMBEDDING_MODEL=bge-large-zh-v1.5
      - EMBEDDING_DIM=1024
      - RERANKER_BASE_URL=http://host.docker.internal:8093
      - RERANKER_MODEL=bge-reranker-base
      - RERANKER_ENABLED=true
      # D 阶段：与 Java 服务共用同一 Redis（embedding/RAG 缓存）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - edu-network
    depends_on:
      - milvus-standalone
      - redis
    restart: unless-stopped

  # 在现有 docker-compose.yml 末尾追加
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edu-network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"  # MinIO Console（可选，方便查看对象存储）
      - "9000:9000"  # S3 API
    volumes:
      - ./milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edu-network

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.1
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"  # gRPC 端口（Python/Java SDK 连接）
      - "9091:9091"    # RESTful API 端口
    volumes:
      - ./milvus/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    networks:
      - edu-network

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: http://milvus-standalone:9091
    ports:
      - "8000:3000"  # Attu Web UI
    depends_on:
      - milvus-standalone
    networks:
      - edu-network
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: edu-portrait-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edu_portrait
      MYSQL_USER: edu
      MYSQL_PASSWORD: edu123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - edu-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: edu-portrait-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edu-network

  # Nacos
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: edu-portrait-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - edu-network

  # Gateway
  gateway:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.gateway
    container_name: edu-portrait-gateway
    environment:
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE:
      # A5：JWT 密钥（≥32 字符，否则 JwtUtil fail-fast）。dev 默认仅供本地起栈，生产务必经 env/Nacos 覆盖。
      JWT_SECRET: ${JWT_SECRET:-edu-portrait-dev-jwt-secret-change-in-prod-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      - nacos
    networks:
      - edu-network

  # ============================================================
  # EduCare Agent 全栈（agent-service + 2 个 MCP server）
  # 本地 LLM/embedding/reranker 仍在宿主 llama.cpp，通过 host.docker.internal 访问。
  # AgentLoop 现为默认主路径（educare.agent.loop.enabled 默认 true）；回落 legacy 置 false。
  # ============================================================

  # H-1.2：student-data MCP server（Java，8094）
  mcp-student-data:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.springboot
      args:
        MODULE: mcp-student-data
    container_name: edu-portrait-mcp-student-data
    environment:
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE:
      MYSQL_HOST: mysql
      # MCP 内部预共享 token（与 agent-service 同值才放行 /mcp）。空=仅网络隔离（A3）
      EDUCARE_MCP_TOKEN: ${EDUCARE_MCP_TOKEN:-}
    ports:
      - "127.0.0.1:8094:8094"   # 仅本机回环：student-data MCP 直吐学生画像，禁外网绕过网关
    depends_on:
      - nacos
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - edu-network
    restart: unless-stopped

  # H-1.3：knowledge-rag MCP server（Python FastMCP，8095，复用 ai-inference 镜像换 command）
  knowledge-rag-mcp:
    build:
      context: ../ai-inference-service
      dockerfile: Dockerfile
    container_name: edu-portrait-knowledge-rag-mcp
    command: ["python", "-m", "app.mcp.knowledge_rag_server"]
    environment:
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMBEDDING_BASE_URL: http://host.docker.internal:8092/v1
      EMBEDDING_MODEL: bge-large-zh-v1.5
      RERANKER_BASE_URL: http://host.docker.internal:8093
      RERANKER_ENABLED: "true"
      MCP_KNOWLEDGE_RAG_PORT: "8095"
    ports:
      - "127.0.0.1:8095:8095"   # 仅本机回环（同 8094）
    depends_on:
      - milvus-standalone
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8095), 3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - edu-network
    restart: unless-stopped

  # H-2：agent-service（8087）—— Agent 编排主体，依赖两个 MCP server 就绪
  agent-service:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.springboot
      args:
        MODULE: agent-service
    container_name: edu-portrait-agent
    environment:
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # A5：JWT 密钥（≥32 字符 fail-fast）。dev 默认仅本地，生产经 env/Nacos 覆盖。
      JWT_SECRET: ${JWT_SECRET:-edu-portrait-dev-jwt-secret-change-in-prod-0123456789}
      # 宿主 llama.cpp（生成 LLM）
      SPRING_AI_OPENAI_BASE_URL: http://host.docker.internal:8091
      # 容器网络内的 MCP server
      MCP_STUDENT_DATA_URL: http://mcp-student-data:8094
      MCP_KNOWLEDGE_RAG_URL: http://knowledge-rag-mcp:8095
      # AgentLoop 为默认主路径（亮点链）；回落 legacy 置 false
      EDUCARE_AGENT_LOOP_ENABLED: "true"
      # MCP 内部预共享 token（纵深防御）。空=仅网络隔离；设值则与 MCP server 互验（A3）
      EDUCARE_MCP_TOKEN: ${EDUCARE_MCP_TOKEN:-}
    ports:
      - "127.0.0.1:8087:8087"   # 仅本机回环：禁外网直连 8087 绕过网关鉴权；本机 smoke/actuator 照常
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_started
      redis:
        condition: service_started
      mcp-student-data:
        condition: service_healthy
      knowledge-rag-mcp:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - edu-network
    restart: unless-stopped

  # G-5.1：Langfuse self-hosted（v2，2 容器版）
  # 用途：LLM 调用全链路 trace（agent-service ChatClient + ai-inference _call_llm_json 全部接入）
  # 启动后访问 http://localhost:3001 注册账号 → 创建 project → 拿 PUBLIC/SECRET key 配到各 service
  # 不放进默认 up 范围（resume 场景可不开），按需 `docker-compose up -d langfuse-server`
  langfuse-postgres:
    image: postgres:15-alpine
    container_name: langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse123}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    networks:
      - edu-network
    profiles:
      - langfuse

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    depends_on:
      - langfuse-postgres
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse123}@langfuse-postgres:5432/langfuse
      # 生产请改为强随机：openssl rand -base64 32
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-only-replace-in-prod-aaaaaaaaaaaaaaaaaaaaaaaa}
      SALT: ${LANGFUSE_SALT:-dev-only-replace-in-prod-bbbbbbbbbbbbbbbbbbbbbbbbb}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3001}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3001:3000"
    networks:
      - edu-network
    profiles:
      - langfuse

volumes:
  mysql_data:
  redis_data:
  langfuse_pg_data:

networks:
  edu-network:
    driver: bridge
