server:
  port: 8087

spring:
  application:
    name: agent-service
    # 替代 bootstrap.yml：直接通过 import 加载 Nacos 配置
  config:
    import:
      - optional:nacos:agent-service.yml?group=DEFAULT_GROUP
      - optional:nacos:common.yml?group=DEFAULT_GROUP
      # H-2.4：灰度切流专用 dataId，仅承载 educare.agent.loop.*；切流脚本只写这一个文件，
      # 避免覆盖 agent-service.yml 主配置。本地裸跑不写 Nacos 时 optional 跳过，回落 application.yml 默认值。
      - optional:nacos:agent-canary.yml?group=DEFAULT_GROUP
  cloud:
    openfeign:
      okhttp:
        enabled: true
      # F-3：开启 CircuitBreaker SPI 桥接，让 @FeignClient(fallbackFactory=) 通过 Sentinel 触发
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 90000   # plan/audit 经过 LLM 可能 60s+，留余量
          ai-inference-service:
            connectTimeout: 5000
            readTimeout: 120000  # AI 链路允许更长

    # Sentinel 流控（D 阶段）：dashboard 留空则只启用本地编码规则，不上报
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
    nacos:
      # 注册中心
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        service: ${spring.application.name}

      # 配置中心
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        file-extension: yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/edu_portrait?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:edu}
    password: ${MYSQL_PASSWORD:edu123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

  ai:
    openai:
      api-key: dummy
      base-url: http://localhost:8091 #http://host.docker.internal:8091
      chat:
        options:
          model: qwen2.5-32b-instruct-q4_k_m
          temperature: 0.3
          max-tokens: 2048
    # H-2.2：MCP client 接两个 Streamable HTTP server。
    # 启动时 Spring AI 1.1.6 auto-config 对每个 connection 走 initialize → tools/list 拉工具清单，
    # 暴露合并的 ToolCallbackProvider Bean。两端均为 fail-fast：server 起不来则 agent-service 起不来。
    mcp:
      client:
        streamable-http:
          connections:
            student-data:
              url: ${MCP_STUDENT_DATA_URL:http://localhost:8094}
              endpoint: /mcp
            knowledge-rag:
              url: ${MCP_KNOWLEDGE_RAG_URL:http://localhost:8095}
              endpoint: /mcp

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# G-3.1：Actuator + Prometheus 暴露策略
# 只放出 health / info / prometheus 三端点，其余默认不可达；
# 路径 /actuator/prometheus 由 ops 抓取。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 日志
logging:
  level:
    com.edu.agent.mapper: debug

educare:
  export:
    # F-1：PDF 导出落盘目录。需可写；启动时若不存在自动创建。
    storage-path: ${EDUCARE_EXPORT_PATH:/tmp/edu-exports}
    # 中文字体路径（classpath: 或 file:）。缺失时 PDF 中文将渲染为方块。详见 docs/educare/deploy.md。
    font-path: ${EDUCARE_FONT_PATH:classpath:/fonts/NotoSansSC-Regular.ttf}
  sse:
    # F-2：SSE 单连接最大存活时长（毫秒）。1800000 = 30 分钟，超时后前端会自动重连。
    timeout-millis: ${EDUCARE_SSE_TIMEOUT_MS:1800000}
    # F-2：心跳间隔（毫秒）。低于 Nginx/Gateway 的 idle timeout 即可，30s 通用安全值。
    heartbeat-millis: ${EDUCARE_SSE_HEARTBEAT_MS:30000}
  rate-limit:
    # /trigger 端点全局 QPS 阈值（D 阶段：保护本地 GPU 推理）
    trigger-qps: ${EDUCARE_TRIGGER_QPS:2}
  idempotency:
    # 同一 studentId 在该窗口内不重复触发；命中则返回已有任务 id
    trigger-window-seconds: ${EDUCARE_TRIGGER_WINDOW:30}
  schedule:
    # E-1：定时扫描总开关。默认关闭，避免开发环境误触发整校扫描；生产经 Nacos 改为 true
    enabled: ${EDUCARE_SCHEDULE_ENABLED:false}
    # 每日 02:00 触发；Spring cron 6 字段（秒 分 时 日 月 周）
    cron: ${EDUCARE_SCHEDULE_CRON:0 0 2 * * ?}
  debug:
    # 仅用于端到端冒烟测试：强制风险等级跳过 LLM 直接进入完整 4 阶段流水线。
    # 生产环境请保持为空。可设 high/medium/low/none。
    force-risk-level: ${EDUCARE_DEBUG_FORCE_RISK_LEVEL:}
  # G-1.3：风险识别 system prompt 已迁移到 classpath:/prompts/risk-analyze.system.md
  # 修改 prompt 直接编辑该文件，无需碰 YAML / Nacos。
  llm:
    # G-1.4：透传给 llama.cpp 的扩展开关。新版本 llama.cpp 默认 true，显式声明兼容旧版。
    cache-prompt: ${EDUCARE_LLM_CACHE_PROMPT:true}
  # H-2.3/H-2.4：AgentLoop 灰度切流。
  # enabled=false（默认）→ AgentTaskServiceImpl.doExecute 全走旧 4 阶段流水线（risk → rag → plan → audit）。
  # enabled=true → 按 canary-percent 灰度路由到 AgentLoop（一次性 think→tool→observe 替换 "风险识别 + 计划生成"，
  #   RAG 检索由 knowledge-rag MCP tool 自然完成；合规审核 P4 仍走原 audit 端点保留）。
  # canary-percent（0-100，enabled 时默认 100）：按 taskId 确定性分桶，约 N% 任务走 AgentLoop，其余 legacy。
  #   切流推进 0→10→50→100 由 scripts/agent_loop_canary.sh 驱动（写 Nacos agent-canary.yml，@RefreshScope 热生效）。
  agent:
    loop:
      enabled: ${EDUCARE_AGENT_LOOP_ENABLED:false}
      canary-percent: ${EDUCARE_AGENT_LOOP_CANARY_PERCENT:100}
    # H-3.5：Skill 加载器。enabled=true 时把 active 列出的技能 markdown 注入 AgentLoop system prompt。
    # dir 为空 → 用 classpath skills/（打包进 jar，不热更新）；
    # dir 指向外部目录 → 优先读该目录并按 mtime 热更新（编辑 md 不需重启，生产可挂载覆盖内置技能）。
    skills:
      enabled: ${EDUCARE_AGENT_SKILLS_ENABLED:true}
      dir: ${EDUCARE_AGENT_SKILLS_DIR:}
      active: ${EDUCARE_AGENT_SKILLS_ACTIVE:risk-assessment,psychological-screening,intervention-design,compliance-audit}
    # J-1.2：工具守卫。enabled=false 全放行；allowed-tools 非空则只放行名单内工具；
    # sensitive-tools 需 sensitiveDataAllowed 或管理员/心理咨询师角色（async 系统任务无上下文时默认放行）。
    tool-guard:
      enabled: ${EDUCARE_AGENT_TOOL_GUARD_ENABLED:true}
      allowed-tools: ${EDUCARE_AGENT_TOOL_GUARD_ALLOWED:}
      sensitive-tools: ${EDUCARE_AGENT_TOOL_GUARD_SENSITIVE:get_mental_indicators}
    # J-2.1：子代理（班主任/心理咨询师/学业导师 agent-as-tool）。默认关，不扰动既有默认链路。
    subagents:
      enabled: ${EDUCARE_AGENT_SUBAGENTS_ENABLED:false}
      max-iterations: ${EDUCARE_AGENT_SUBAGENTS_MAX_ITER:4}
    # J-2.2：记忆接线（loop 前 recall 注入、终态后 save_episode）。默认关。
    # 启用需两步：① 把 memory-server(8096) 加进 spring.ai.mcp.client.streamable-http.connections
    #   （加 memory.url=http://localhost:8096，使 recall_student_history/save_episode 工具进 provider）；
    #   ② 本开关置 true。未配连接时 MemoryGateway 找不到工具 → 自动 no-op 降级，不影响主流程。
    memory:
      enabled: ${EDUCARE_AGENT_MEMORY_ENABLED:false}
    # J-3.2：AgentLoop 过程流式（每轮 thought/tool 发 Redis PROGRESS_CHANNEL，前端 SSE 展示）。默认关。
    streaming:
      enabled: ${EDUCARE_AGENT_STREAMING_ENABLED:false}
    # J-3.3：检查点（每轮轨迹 RPUSH Redis，崩溃可 post-mortem/续跑基础）。默认关。
    checkpoint:
      enabled: ${EDUCARE_AGENT_CHECKPOINT_ENABLED:false}
      ttl-seconds: ${EDUCARE_AGENT_CHECKPOINT_TTL:3600}
  # H-4：Model Router 双路由。敏感/原始画像 → 本地 tier（数据不出本地）；方案/审核（已脱敏、偏推理）→ 云端 tier。
  # 云端默认关闭；enabled=true 且 api-key 非空才真正启用，否则 ModelRouter 一律回落本地（fail-safe）。
  # 云端 api-key 建议走 Nacos 加密配置（agent-service.yml）或环境变量，勿明文入库。
  model:
    local:
      # 本地 tier base-url 复用 spring.ai.openai.base-url；如需独立本地 14B 实例（如 8092）改这里。
      base-url: ${EDUCARE_LOCAL_LLM_BASE_URL:${spring.ai.openai.base-url:http://host.docker.internal:8091}}
    cloud:
      enabled: ${EDUCARE_CLOUD_ENABLED:false}
      base-url: ${EDUCARE_CLOUD_LLM_BASE_URL:https://api.openai.com}
      api-key: ${EDUCARE_CLOUD_LLM_API_KEY:}
      model: ${EDUCARE_CLOUD_LLM_MODEL:gpt-4o-mini}

# G-5.3：Langfuse trace。所有字段空时 LangfuseClient 自动 no-op，主流程零影响。
# self-hosted v2：host 用 docker 内网名 langfuse-server:3000；本地裸跑用 http://localhost:3001
langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  host: ${LANGFUSE_HOST:}