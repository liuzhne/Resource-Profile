# ==============================================================================
# Render Blueprint Specification - 100% Free Tier (零费用免费版)
# Docs: https://render.com/docs/free
# ==============================================================================

version: 1

# ------------------------------------------------------------------------------
# 共享环境变量组 (统一管控数据库、Redis、JWT密钥与 AI 模型配置)
# ------------------------------------------------------------------------------
envVarGroups:
  - name: edu-portrait-common-env
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 禁用 Nacos 注册与配置拉取（Render 独立容器运行）
      - key: SPRING_CLOUD_NACOS_DISCOVERY_ENABLED
        value: "false"
      - key: SPRING_CLOUD_NACOS_CONFIG_ENABLED
        value: "false"
      - key: SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED
        value: "false"
      - key: SPRING_CONFIG_IMPORT
        value: "optional:classpath:application.yml"
      # JWT 认证密钥：Render 自动生成强随机 256 位安全密钥
      - key: JWT_SECRET
        generateValue: true
      # MCP 内部通信安全 Token（纵深防御）
      - key: EDUCARE_MCP_TOKEN
        generateValue: true
      # MySQL 数据库连接配置 (Render 免费实例互联)
      - key: MYSQL_HOST
        value: edu-portrait-mysql.onrender.com
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: edu_portrait
      - key: MYSQL_USER
        value: edu
      - key: MYSQL_PASSWORD
        value: edu123456
      # Redis 会话缓存配置 (Render 免费实例互联)
      - key: REDIS_HOST
        value: edu-portrait-redis.onrender.com
      - key: REDIS_PORT
        value: "6379"
      # AI 与大模型接口通用配置
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: qwen2.5-14b
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "2048"

services:
  # ============================================================================
  # 1. 前端 Vue 3 单页应用 (Render Static Site - 100% 免费全球 CDN)
  # ============================================================================
  - type: web
    name: edu-portrait-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /api/*
        destination: https://edu-portrait-gateway.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    autoDeploy: true

  # ============================================================================
  # 2. 网关服务 (Web Service - 100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.gateway
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      - key: AUTH_SERVICE_URL
        value: https://edu-portrait-auth.onrender.com
      - key: USER_SERVICE_URL
        value: https://edu-portrait-user.onrender.com
      - key: TEACHER_SERVICE_URL
        value: https://edu-portrait-teacher.onrender.com
      - key: STUDENT_SERVICE_URL
        value: https://edu-portrait-student.onrender.com
      - key: MENTAL_SERVICE_URL
        value: https://edu-portrait-mental.onrender.com
      - key: DATA_SERVICE_URL
        value: https://edu-portrait-data.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://edu-portrait-agent.onrender.com
    autoDeploy: true

  # ============================================================================
  # 3. 核心业务微服务群 (Web Services - 100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-auth
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.auth
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-user
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.user
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-teacher
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.teacher
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-student
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.student
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-mental
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.mental
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-data
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.data
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  # ============================================================================
  # 4. EduCare Agent 智能编排与 MCP 节点 (100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-agent
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.agent
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      - key: MCP_STUDENT_DATA_URL
        value: https://edu-portrait-mcp-student.onrender.com
      - key: MCP_KNOWLEDGE_RAG_URL
        value: https://edu-portrait-ai-inference.onrender.com
      - key: EDUCARE_AGENT_LOOP_ENABLED
        value: "true"
      - key: LLM_API_KEY
        sync: false
    autoDeploy: true

  - type: web
    name: edu-portrait-mcp-student
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.mcp-student-data
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
    autoDeploy: true

  - type: web
    name: edu-portrait-ai-inference
    runtime: docker
    dockerContext: ./ai-inference-service
    dockerfilePath: ./ai-inference-service/Dockerfile
    plan: free
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: LLM_API_KEY
        sync: false
    autoDeploy: true

  # ============================================================================
  # 5. 基础设施：Redis 缓存与 MySQL 数据库 (100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-redis
    runtime: image
    image:
      url: redis:7-alpine
    plan: free
    envVars:
      - key: PORT
        value: "6379"

  - type: web
    name: edu-portrait-mysql
    runtime: docker
    dockerContext: ./
    dockerfilePath: ./docker/Dockerfile.mysql
    plan: free
    envVars:
      - key: PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: edu_portrait
      - key: MYSQL_USER
        value: edu
      - key: MYSQL_PASSWORD
        value: edu123456
      - key: MYSQL_ROOT_PASSWORD
        value: root123456
      - key: TZ
        value: Asia/Shanghai
